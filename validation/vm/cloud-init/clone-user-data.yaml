#cloud-config
preserve_hostname: false
manage_etc_hosts: true
ssh_deletekeys: true
ssh_genkeytypes:
  - ed25519
  - ecdsa
  - rsa
package_update: false
package_upgrade: false
runcmd:
  - [touch, /var/lib/morpheus-validation-clone-ready]
final_message: Morpheus validation scenario identity is ready.
