name: ${MORPHEUS_LOAD_PROJECT:-morpheus-load-dev}

x-security: &security
  init: true
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=32m,mode=1777"]

x-logging: &logging
  driver: local
  options:
    max-size: 1m
    max-file: "1"
    compress: "false"

services:
  fixture:
    <<: *security
    build:
      context: ../fixtures
      dockerfile: Dockerfile
    image: ${MORPHEUS_LOAD_PROJECT:-morpheus-load-dev}-fixture:dev
    environment:
      FIXTURE_API_KEY: morpheus-load-upstream-key
      FIXTURE_BIND_ADDRESS: "0.0.0.0"
      FIXTURE_PORT: "8000"
    expose: ["8000"]
    networks: [load_internal]
    labels:
      io.morpheus.project: ${MORPHEUS_LOAD_PROJECT:-morpheus-load-dev}
      io.morpheus.component: fixture
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s
    deploy:
      resources:
        limits: {memory: 128M, cpus: "1.0"}
    logging: *logging

  api:
    <<: *security
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: ${MORPHEUS_LOAD_PROJECT:-morpheus-load-dev}-backend:dev
    environment: &backend-environment
      MORPHEUS_PROJECT_ID: ${MORPHEUS_LOAD_PROJECT:-morpheus-load-dev}
      MORPHEUS_BIND_ADDRESS: "0.0.0.0"
      MORPHEUS_ALLOW_LAN: "true"
      MORPHEUS_DATA_DIR: /var/lib/morpheus
      MORPHEUS_LLM_BASE_URL: http://fixture:8000/v1
      MORPHEUS_LLM_MODEL: morpheus-fixture-model
      MORPHEUS_API_KEY: morpheus-load-proxy-key
      MORPHEUS_UPSTREAM_API_KEY: morpheus-load-upstream-key
      MORPHEUS_SESSION_SECRET: morpheus-load-session-secret-32-bytes
      MORPHEUS_SESSION_COOKIE_SECURE: "false"
      MORPHEUS_MAX_CONCURRENT_REQUESTS: "64"
      MORPHEUS_MAX_REQUESTS_PER_MINUTE: "10000"
      MORPHEUS_REQUEST_TIMEOUT_SECONDS: "5"
    expose: ["7400"]
    networks: [load_internal]
    volumes: [load_data:/var/lib/morpheus]
    labels:
      io.morpheus.project: ${MORPHEUS_LOAD_PROJECT:-morpheus-load-dev}
      io.morpheus.component: api
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7400/healthz', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    deploy:
      resources:
        limits: {memory: 512M, cpus: "1.0"}
    logging: *logging

  dashboard:
    <<: *security
    build:
      context: ../..
      dockerfile: web/Dockerfile
    image: ${MORPHEUS_LOAD_PROJECT:-morpheus-load-dev}-dashboard:dev
    environment:
      MORPHEUS_BIND_ADDRESS: "0.0.0.0"
      MORPHEUS_ALLOW_LAN: "true"
      MORPHEUS_DASHBOARD_PORT: "7401"
    expose: ["7401"]
    networks: [load_internal]
    labels:
      io.morpheus.project: ${MORPHEUS_LOAD_PROJECT:-morpheus-load-dev}
      io.morpheus.component: dashboard
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7401/healthz', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.5"}
    logging: *logging

  telemetry:
    <<: *security
    image: ${MORPHEUS_LOAD_PROJECT:-morpheus-load-dev}-backend:dev
    pull_policy: never
    command: [morpheus-telemetry]
    environment:
      <<: *backend-environment
      MORPHEUS_ENABLE_TELEMETRY: "true"
      MORPHEUS_TELEMETRY_PORT: "7410"
      MORPHEUS_TELEMETRY_RETENTION_DAYS: "1"
    expose: ["7410"]
    networks: [load_internal]
    volumes: [load_data:/var/lib/morpheus]
    labels:
      io.morpheus.project: ${MORPHEUS_LOAD_PROJECT:-morpheus-load-dev}
      io.morpheus.component: telemetry
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7410/healthz', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    deploy:
      resources:
        limits: {memory: 256M, cpus: "1.0"}
    logging: *logging

networks:
  load_internal:
    internal: true
    labels:
      io.morpheus.project: ${MORPHEUS_LOAD_PROJECT:-morpheus-load-dev}

volumes:
  load_data:
    labels:
      io.morpheus.project: ${MORPHEUS_LOAD_PROJECT:-morpheus-load-dev}
