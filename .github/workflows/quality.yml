name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.8.0
      - name: Bootstrap
        run: make bootstrap
      - name: Gate
        run: make gate

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Frontend gate
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/home
          -v "${{ github.workspace }}/web:/work" -w /work
          node:22.17.1-alpine3.22@sha256:5539840ce9d013fa13e3b9814c9353024be7ac75aca5db6d039504a56c04ea59
          sh -lc 'npm ci --ignore-scripts && npm run format-check && npm run typecheck && npm test && npm run build'

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install webkit and GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.1
      - name: Format
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --lib --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib --locked
