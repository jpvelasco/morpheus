[package]
name = "morpheus-desktop"
version = "0.1.0"
description = "Minimal-capability Tauri shell for the Morpheus operations workspace"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "morpheus_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.4"

[profile.release]
strip = true
lto = true
codegen-units = 1